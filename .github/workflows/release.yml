name: release

# Runs on a version tag: git tag v0.1.0 && git push origin v0.1.0
# Checks that the tag matches package.json and that the tests pass. Publishing to npm and
# pushing the image to GHCR are not added yet; they go after these checks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          [ "v$VERSION" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, but package.json has $VERSION"; exit 1; }

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - run: yarn test

      # Builds the image the way publishing will, without pushing it
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
