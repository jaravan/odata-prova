# Monthly updates, each ecosystem's in one pull request. CI tests them like any other.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # Its major follows the lowest Node in engines (22), so typecheck catches newer APIs
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The base image, pinned by digest in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
